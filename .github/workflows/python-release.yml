name: Build Python release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade build twine
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -c 'import os, pathlib, re; text = pathlib.Path("sift/__init__.py").read_text(); version = re.search(r"^__version__ = \"([^\"]+)\"", text, re.M).group(1); expected = f"v{version}"; actual = os.environ["RELEASE_TAG"]; assert actual == expected, f"release tag {actual!r} != {expected!r}"'
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Verify clean wheel install
        run: |
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install dist/*.whl
          (cd "$smoke_dir" && "$smoke_dir/venv/bin/python" "$GITHUB_WORKSPACE/scripts/verify_wheel_install.py")
      - name: Upload workflow copy of distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
      - name: Attach distributions to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
