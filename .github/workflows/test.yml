name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install -e ".[categorical]"
      - name: Run tests
        run: pytest tests/
      - name: Run critical lint checks
        if: matrix.python-version == '3.12'
        run: ruff check sift tests
  test-catboost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"
      - name: Run full suite with CatBoost
        run: pytest tests/ -q
  test-latest-deps:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install latest pre-release dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade --pre numpy pandas scikit-learn scipy numba joblib
          pip install -e ".[test,all]" --no-deps
          pip install pytest ruff threadpoolctl category_encoders catboost
      - name: Run tests
        run: pytest tests/ -q

  benchmark-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,test]"
      - name: Run quick benchmark promotion gate
        run: python benchmarks/run_benchmarks.py --quick --output benchmark-results.json
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: sift-quick-benchmark-results
          path: benchmark-results.json
